[project]
name = "mongodb-readonly-mcp"
version = "0.1.0"
description = "Local MCP server (stdio) with read-only access to MongoDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9",
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mongomock>=4.1"]

[project.scripts]
mongodb-readonly-mcp = "mongodb_readonly_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mongodb_readonly_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
